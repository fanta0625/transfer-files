[package]
name = "transfer-files"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Dual-pane client for two-stage SSH file browsing and transfers"
build = "build.rs"

[dependencies]
base64 = "0.23"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "unstable-winit-030"] }

[build-dependencies]
slint-build = "=1.18.1"

[target.'cfg(target_os = "linux")'.dependencies]
portable-pty = "0.9"
raw-window-handle = "0.6"
x11rb = "0.13"

[dev-dependencies]
tempfile = "3"
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = "thin"
